<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111827">
  <title>Kousen.CommandCenter</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #111827;
      --panel: #182231;
      --panel-2: #202c3d;
      --text: #f8fafc;
      --muted: #aeb8c6;
      --line: #314156;
      --brand-accent: #ef4444;
      --accent: var(--brand-accent);
      --green: #22c55e;
      --green-dark: #12823a;
      --danger: #ef4444;
      --background-image: none;
      --background-overlay-opacity: 0.50;
      --shadow: 0 22px 70px rgba(0, 0, 0, 0.34);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
      overflow: hidden;
    }

    body {
      min-height: 100%;
      margin: 0;
      background:
        linear-gradient(rgba(17, 24, 39, var(--background-overlay-opacity)), rgba(17, 24, 39, var(--background-overlay-opacity))),
        var(--background-image),
        radial-gradient(circle at top left, rgba(47, 128, 237, 0.20), transparent 36rem),
        linear-gradient(135deg, #111827 0%, #172033 46%, #10151f 100%);
      background-size: cover, cover, auto, auto;
      background-position: center, center, center, center;
      background-repeat: no-repeat, no-repeat, no-repeat, no-repeat;
      color: var(--text);
    }

    button,
    input,
    select {
      font: inherit;
    }

    button {
      border: 0;
      cursor: pointer;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .shell {
      height: 100dvh;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      overflow: hidden;
    }

    .topbar {
      height: clamp(62px, 9vh, 82px);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 clamp(18px, 4vw, 52px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      background: rgba(24, 34, 49, 0.88);
      backdrop-filter: blur(16px);
    }

    .brand {
      min-width: 0;
    }

    .brand h1 {
      margin: 0;
      font-size: clamp(1.2rem, 2.3vw, 1.8rem);
      line-height: 1.1;
      font-weight: 400;
      letter-spacing: 0;
    }

    .brand-kousen {
      color: var(--text);
      font-weight: 800;
    }

    .brand-dot {
      color: var(--text);
      font-weight: 400;
    }

    .brand-command {
      color: var(--brand-accent);
      font-weight: 400;
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .history-actions {
      display: none;
      align-items: center;
      gap: 8px;
    }

    .settings-on .history-actions {
      display: flex;
    }

    .toolbar-button,
    .settings-button {
      width: 46px;
      height: 46px;
      display: grid;
      place-items: center;
      border-radius: 8px;
      color: var(--text);
      background: transparent;
      border: 0;
      transition: transform 160ms ease, color 160ms ease;
    }

    .toolbar-button:focus-visible,
    .toolbar-button.remote-focus,
    .settings-button:focus-visible,
    .settings-button.remote-focus {
      color: #ffffff;
      outline: 4px solid #ffffff;
      outline-offset: 4px;
      transform: translateY(-1px);
    }

    .settings-button[aria-pressed="true"] {
      color: var(--brand-accent);
    }

    .toolbar-button:disabled {
      cursor: default;
      opacity: 0.35;
    }

    .toolbar-button:disabled:hover {
      outline: none;
      transform: none;
    }

    .icon {
      width: 24px;
      height: 24px;
      display: block;
    }

    .main {
      width: 100%;
      height: 100%;
      min-height: 0;
      margin: 0 auto;
      padding: clamp(14px, 2.6vmin, 32px);
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      gap: clamp(10px, 2vmin, 22px);
      overflow: hidden;
    }

    .controls {
      display: none;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      min-height: 42px;
    }

    .settings-on .controls {
      display: flex;
    }

    .mode-copy {
      margin: 0;
      color: var(--muted);
      font-size: 0.94rem;
    }

    .button-cluster {
      display: flex;
      gap: 8px;
      padding: 4px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.10);
    }

    .settings-actions {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .grid-size,
    .panel-icon-button {
      min-width: 42px;
      height: 42px;
      display: grid;
      place-items: center;
      border-radius: 6px;
      color: var(--muted);
      background: transparent;
    }

    .homepage-button {
      width: auto;
      min-width: 152px;
      padding: 0 12px;
      grid-auto-flow: column;
      gap: 8px;
    }

    .grid-size:focus-visible,
    .grid-size.remote-focus,
    .panel-icon-button:focus-visible,
    .panel-icon-button.remote-focus {
      color: var(--text);
      outline: 4px solid #ffffff;
      outline-offset: 3px;
    }

    .grid-size.active,
    .panel-icon-button.active {
      color: var(--text);
      background: var(--accent);
    }

    .reset-button {
      height: 52px;
      border-radius: 6px;
      padding: 0 14px;
      color: var(--text);
      background: rgba(255, 255, 255, 0.10);
      border: 1px solid rgba(255, 255, 255, 0.12);
    }

    .reset-button:focus-visible,
    .reset-button.remote-focus {
      outline: 4px solid #ffffff;
      outline-offset: 3px;
    }

    .grid-wrap {
      min-height: 0;
      height: 100%;
      width: 100%;
      display: grid;
      place-items: center;
      padding: clamp(8px, 1.4vmin, 20px) 0;
      overflow: hidden;
    }

    .settings-on .grid-wrap {
      padding: 0;
    }

    .app-grid {
      --cell-size: 180px;
      --grid-gap: clamp(10px, 1.5vmin, 18px);
      width: max-content;
      max-width: 100%;
      max-height: 100%;
      display: grid;
      grid-template-columns: repeat(var(--columns), var(--cell-size));
      grid-auto-rows: var(--cell-size);
      gap: var(--grid-gap);
      align-content: center;
      justify-content: center;
    }

    .slot {
      min-width: 0;
      min-height: 0;
      position: relative;
      border-radius: 8px;
    }

    .settings-on .slot {
      border: 1px dashed rgba(255, 255, 255, 0.20);
      background: rgba(255, 255, 255, 0.035);
    }

    .app-card,
    .add-card {
      width: 100%;
      height: 100%;
      border-radius: 8px;
      display: grid;
      place-items: center;
      text-align: center;
      overflow: hidden;
    }

    .app-card {
      position: relative;
      padding: clamp(10px, 2vw, 20px);
      background:
        linear-gradient(145deg, rgba(255, 255, 255, 0.12), rgba(255, 255, 255, 0.035)),
        var(--card-color);
      border: 1px solid rgba(255, 255, 255, 0.14);
      box-shadow: var(--shadow);
      transition: transform 160ms ease, border-color 160ms ease, box-shadow 160ms ease;
    }

    .app-card:focus-visible,
    .app-card.remote-focus {
      transform: translateY(-3px);
      border-color: #ffffff;
      box-shadow: 0 28px 80px rgba(0, 0, 0, 0.42);
      outline: 4px solid #ffffff;
      outline-offset: 4px;
    }

    .settings-on .app-card {
      cursor: default;
    }

    .app-content {
      display: grid;
      place-items: center;
      gap: clamp(8px, 1.4vw, 14px);
      min-width: 0;
      width: 100%;
    }

    .app-icon {
      width: clamp(42px, calc(var(--cell-size) * 0.24), 104px);
      height: clamp(42px, calc(var(--cell-size) * 0.24), 104px);
      display: grid;
      place-items: center;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.16);
      border: 1px solid rgba(255, 255, 255, 0.18);
      font-size: clamp(1.15rem, calc(var(--cell-size) * 0.12), 2.75rem);
      font-weight: 800;
      text-transform: uppercase;
    }

    .app-icon img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      border-radius: 6px;
    }

    .app-name {
      width: 100%;
      overflow-wrap: anywhere;
      font-size: clamp(0.92rem, calc(var(--cell-size) * 0.07), 1.65rem);
      font-weight: 740;
      line-height: 1.18;
    }

    .move-actions,
    .edit-actions {
      position: absolute;
      top: 8px;
      display: none;
      gap: 6px;
    }

    .move-actions {
      left: 8px;
    }

    .edit-actions {
      right: 8px;
    }

    .settings-on .move-actions,
    .settings-on .edit-actions {
      display: flex;
    }

    .icon-button {
      width: 32px;
      height: 32px;
      display: grid;
      place-items: center;
      line-height: 0;
      border-radius: 6px;
      color: var(--text);
      background: rgba(0, 0, 0, 0.36);
      border: 1px solid rgba(255, 255, 255, 0.16);
    }

    .icon-button .icon,
    .plus-mark .icon {
      width: 20px;
      height: 20px;
    }

    .icon-button:focus-visible,
    .icon-button.remote-focus {
      outline: 4px solid #ffffff;
      outline-offset: 3px;
    }

    .icon-button:disabled {
      color: rgba(248, 250, 252, 0.34);
      cursor: default;
      background: rgba(0, 0, 0, 0.18);
      border-color: rgba(255, 255, 255, 0.08);
    }

    .icon-button:disabled:hover {
      outline: none;
    }

    .delete-button:hover,
    .delete-button:focus-visible {
      background: rgba(239, 68, 68, 0.82);
    }

    .add-card {
      color: var(--text);
      background: rgba(34, 197, 94, 0.18);
      border: 1px dashed rgba(34, 197, 94, 0.66);
      opacity: 0;
      pointer-events: none;
      transition: opacity 140ms ease, background 140ms ease, transform 140ms ease;
    }

    .settings-on .add-card {
      opacity: 1;
      pointer-events: auto;
    }

    .add-card:focus-visible,
    .add-card.remote-focus {
      background: rgba(34, 197, 94, 0.28);
      transform: translateY(-2px);
      outline: 4px solid #ffffff;
      outline-offset: 4px;
    }

    .plus-mark {
      width: clamp(38px, 7vw, 64px);
      height: clamp(38px, 7vw, 64px);
      display: grid;
      place-items: center;
      color: var(--green);
    }

    .empty-state {
      grid-column: 1 / -1;
      padding: 52px 20px;
      text-align: center;
      color: var(--muted);
      border: 1px dashed rgba(255, 255, 255, 0.18);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.035);
    }

    .version {
      position: fixed;
      left: 50%;
      bottom: 12px;
      transform: translateX(-50%);
      color: rgba(248, 250, 252, 0.56);
      font-size: 0.75rem;
      letter-spacing: 0;
      pointer-events: none;
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      display: none;
      place-items: center;
      padding: 20px;
      background: rgba(7, 10, 16, 0.72);
      backdrop-filter: blur(10px);
      z-index: 20;
      overflow: auto;
    }

    .modal-backdrop.open {
      display: grid;
    }

    .dialog {
      width: min(440px, 100%);
      max-height: min(88dvh, 760px);
      overflow: auto;
      border-radius: 8px;
      background: var(--panel);
      border: 1px solid rgba(255, 255, 255, 0.14);
      box-shadow: var(--shadow);
    }

    .dialog.wide {
      width: min(560px, 100%);
    }

    .dialog-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 18px 20px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.10);
    }

    .dialog-title {
      margin: 0;
      font-size: 1.12rem;
    }

    .form {
      display: grid;
      gap: 16px;
      padding: 20px;
    }

    .field {
      display: grid;
      gap: 7px;
    }

    .field label {
      color: var(--muted);
      font-size: 0.88rem;
    }

    .field input,
    .field select {
      width: 100%;
      min-height: 44px;
      border-radius: 6px;
      border: 1px solid rgba(255, 255, 255, 0.16);
      background: rgba(255, 255, 255, 0.08);
      color: var(--text);
      padding: 0 12px;
      outline: none;
    }

    .field input:focus,
    .field select:focus {
      border-color: rgba(47, 128, 237, 0.84);
      box-shadow: 0 0 0 3px rgba(47, 128, 237, 0.18);
    }

    .field option {
      color: #111827;
    }

    .color-select {
      position: relative;
    }

    .color-select-input {
      display: none;
    }

    .color-select-button {
      width: 100%;
      min-height: 44px;
      border-radius: 6px;
      border: 1px solid rgba(255, 255, 255, 0.16);
      background: rgba(255, 255, 255, 0.08);
      color: var(--text);
      padding: 0 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .color-select-value {
      display: inline-flex;
      align-items: center;
      gap: 10px;
    }

    .color-swatch {
      width: 14px;
      height: 14px;
      border-radius: 3px;
      border: 1px solid rgba(255, 255, 255, 0.36);
      background: var(--swatch-color);
      flex: 0 0 auto;
    }

    .color-select-menu {
      display: none;
      margin-top: 6px;
      padding: 6px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.16);
      background: #111827;
      box-shadow: var(--shadow);
      max-height: 124px;
      overflow-y: auto;
    }

    .color-select.open .color-select-menu {
      display: grid;
      gap: 4px;
    }

    .color-option {
      min-height: 36px;
      border-radius: 6px;
      padding: 0 10px;
      color: var(--text);
      background: transparent;
      display: flex;
      align-items: center;
      gap: 10px;
      text-align: left;
    }

    .color-option:hover,
    .color-option:focus-visible {
      background: rgba(255, 255, 255, 0.10);
      outline: none;
    }

    .upload-panel {
      display: grid;
      grid-template-columns: minmax(128px, 168px) minmax(128px, 168px);
      align-items: stretch;
      justify-content: center;
      gap: 12px;
    }

    .image-preview {
      width: 100%;
      aspect-ratio: 1;
      min-height: 0;
      border-radius: 8px;
      border: 1px dashed rgba(255, 255, 255, 0.22);
      background: rgba(255, 255, 255, 0.055);
      display: grid;
      place-items: center;
      overflow: hidden;
      color: var(--muted);
      font-size: 0.88rem;
    }

    .image-preview img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .upload-actions {
      display: grid;
      align-content: center;
      gap: 10px;
    }

    .transparency-group {
      display: grid;
      gap: 7px;
      padding-top: 2px;
    }

    .transparency-options {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
    }

    .transparency-button {
      min-height: 34px;
      border-radius: 6px;
      color: var(--text);
      background: rgba(255, 255, 255, 0.10);
      border: 1px solid rgba(255, 255, 255, 0.12);
      font-size: 0.82rem;
      font-weight: 720;
    }

    .transparency-button.active {
      background: var(--accent);
      color: var(--text);
    }

    .transparency-label {
      color: var(--muted);
      font-size: 0.78rem;
      text-align: center;
    }

    .upload-actions .secondary {
      width: 100%;
    }

    .file-input {
      display: none;
    }

    .actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      padding-top: 4px;
    }

    .secondary,
    .primary,
    .danger {
      min-height: 42px;
      border-radius: 6px;
      padding: 0 16px;
      color: var(--text);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .secondary {
      background: rgba(255, 255, 255, 0.10);
      border: 1px solid rgba(255, 255, 255, 0.12);
    }

    .primary {
      background: var(--green);
      color: #062814;
      font-weight: 760;
    }

    .primary:hover,
    .primary:focus-visible {
      background: #3ee173;
      outline: none;
    }

    .danger {
      background: rgba(239, 68, 68, 0.18);
      border: 1px solid rgba(239, 68, 68, 0.45);
    }

    .hint {
      margin: -4px 0 0;
      color: var(--muted);
      font-size: 0.8rem;
      line-height: 1.35;
    }

    @media (max-width: 720px) {
      .topbar {
        min-height: 68px;
        gap: 12px;
      }

      .brand p {
        display: none;
      }

      .main {
        gap: 16px;
      }

      .controls {
        align-items: stretch;
        flex-direction: column;
      }

      .button-cluster {
        width: 100%;
      }

      .settings-actions {
        width: 100%;
      }

      .grid-size {
        flex: 1;
      }

      .reset-button {
        flex: 1 1 100%;
      }

      .upload-panel {
        grid-template-columns: 1fr;
      }

      .app-grid {
        gap: 10px;
      }
    }
  </style>
</head>
<body>
  <div class="shell" id="appShell">
    <header class="topbar">
      <div class="brand">
        <h1><span class="brand-kousen">Kousen</span><span class="brand-dot">.</span><span class="brand-command">CommandCenter</span></h1>
      </div>
      <div class="top-actions">
        <div class="history-actions" aria-label="History controls">
          <button class="toolbar-button" id="exportButton" type="button" aria-label="Export setup" title="Export Setup"></button>
          <button class="toolbar-button" id="importButton" type="button" aria-label="Import setup" title="Import Setup"></button>
          <input class="file-input" id="importFileInput" type="file" accept="application/json,.json">
          <button class="toolbar-button" id="undoButton" type="button" aria-label="Undo" title="Undo"></button>
          <button class="toolbar-button" id="redoButton" type="button" aria-label="Redo" title="Redo"></button>
        </div>
        <button class="settings-button" id="settingsToggle" type="button" aria-label="Toggle settings" aria-pressed="false" title="Settings"></button>
      </div>
    </header>

    <main class="main">
      <section class="controls" aria-label="Layout controls">
        <div class="settings-actions">
          <div class="button-cluster" role="group" aria-label="Theme controls">
            <button class="panel-icon-button homepage-button" id="backgroundButton" type="button" aria-label="Edit homepage" title="Edit Homepage"></button>
          </div>
          <div class="button-cluster" role="group" aria-label="Grid size">
            <button class="grid-size" type="button" data-columns="2" aria-label="2 columns" title="2 columns"></button>
            <button class="grid-size" type="button" data-columns="3" aria-label="3 columns" title="3 columns"></button>
            <button class="grid-size" type="button" data-columns="4" aria-label="4 columns" title="4 columns"></button>
          </div>
          <button class="reset-button" id="resetPublished" type="button">Reset to Defaults</button>
        </div>
      </section>

      <section class="grid-wrap" aria-label="CommandCenter apps">
        <div class="app-grid" id="appGrid"></div>
      </section>
    </main>
  </div>

  <div class="modal-backdrop" id="modalBackdrop" role="presentation">
    <section class="dialog" role="dialog" aria-modal="true" aria-labelledby="dialogTitle">
      <div class="dialog-header">
        <h2 class="dialog-title" id="dialogTitle">Add App</h2>
      </div>
      <form class="form" id="appForm">
        <input type="hidden" id="slotInput">
        <input type="hidden" id="editingId">

        <div class="field">
          <label for="nameInput">App Name</label>
          <input id="nameInput" name="name" autocomplete="off" required maxlength="36" placeholder="KousenTV">
        </div>

        <div class="field">
          <label for="urlInput">URL</label>
          <input id="urlInput" name="url" inputmode="url" required placeholder="http://192.168.10.10:8000">
        </div>

        <div class="field">
          <label>App Logo</label>
          <div class="upload-panel">
            <div class="image-preview" id="logoPreview">No logo selected</div>
            <input class="file-input" id="logoFileInput" type="file" accept="image/*">
            <div class="upload-actions">
              <button class="secondary" id="logoUploadButton" type="button"></button>
              <button class="secondary" id="logoClearButton" type="button"></button>
            </div>
          </div>
        </div>

        <div class="field">
          <label for="colorInput">Card Color</label>
          <div class="color-select" data-color-select>
            <input class="color-select-input" id="colorInput" name="color" value="#2563eb">
            <button class="color-select-button" type="button" aria-haspopup="listbox" aria-expanded="false">
              <span class="color-select-value"></span>
              <span aria-hidden="true">▾</span>
            </button>
            <div class="color-select-menu" role="listbox">
              <button class="color-option" type="button" data-value="#2563eb" data-label="Blue"><span class="color-swatch" style="--swatch-color: #2563eb;"></span>Blue</button>
              <button class="color-option" type="button" data-value="#16a34a" data-label="Green"><span class="color-swatch" style="--swatch-color: #16a34a;"></span>Green</button>
              <button class="color-option" type="button" data-value="#dc2626" data-label="Red"><span class="color-swatch" style="--swatch-color: #dc2626;"></span>Red</button>
              <button class="color-option" type="button" data-value="#d97706" data-label="Amber"><span class="color-swatch" style="--swatch-color: #d97706;"></span>Amber</button>
              <button class="color-option" type="button" data-value="#7c3aed" data-label="Violet"><span class="color-swatch" style="--swatch-color: #7c3aed;"></span>Violet</button>

  <script>

    const ICONS = {

      wallpaper: '<svg class="icon" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 17v4"/><path d="M8 21h8"/><path d="m9 17 6.1-6.1a2 2 0 0 1 2.81.01L22 15"/><circle cx="8" cy="9" r="2"/><rect x="2" y="3" width="20" height="14" rx="2"/></svg>',
      imageUp: '<svg class="icon" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10.3 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v10l-3.1-3.1a2 2 0 0 0-2.814.014L6 21"/><path d="m14 19.5 3-3 3 3"/><path d="M17 22v-5.5"/><circle cx="9" cy="9" r="2"/></svg>',
      trash: '<svg class="icon" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>'
    };

    const shell = document.getElementById("appShell");
    const main = document.querySelector(".main");
    const appGrid = document.getElementById("appGrid");
    const settingsToggle = document.getElementById("settingsToggle");
    const brandName = document.querySelector(".brand-kousen");
    const exportButton = document.getElementById("exportButton");
    const importButton = document.getElementById("importButton");
    const importFileInput = document.getElementById("importFileInput");
    const undoButton = document.getElementById("undoButton");
    const redoButton = document.getElementById("redoButton");
    const backgroundButton = document.getElementById("backgroundButton");
    const modalBackdrop = document.getElementById("modalBackdrop");
    const appForm = document.getElementById("appForm");
    const dialogTitle = document.getElementById("dialogTitle");
    const cancelDialog = document.getElementById("cancelDialog");
    const slotInput = document.getElementById("slotInput");
    const editingId = document.getElementById("editingId");
    const nameInput = document.getElementById("nameInput");
    const urlInput = document.getElementById("urlInput");
    const colorInput = document.getElementById("colorInput");
    const logoPreview = document.getElementById("logoPreview");
    const logoFileInput = document.getElementById("logoFileInput");
    const logoUploadButton = document.getElementById("logoUploadButton");
    const logoClearButton = document.getElementById("logoClearButton");
    const resetPublished = document.getElementById("resetPublished");
    const deleteBackdrop = document.getElementById("deleteBackdrop");
    const cancelDelete = document.getElementById("cancelDelete");
    const confirmDelete = document.getElementById("confirmDelete");
    const deleteMessage = document.getElementById("deleteMessage");
    const backgroundBackdrop = document.getElementById("backgroundBackdrop");
    const homepageNameInput = document.getElementById("homepageNameInput");
    const homepageAccentInput = document.getElementById("homepageAccentInput");
    const backgroundPreview = document.getElementById("backgroundPreview");
    const backgroundFileInput = document.getElementById("backgroundFileInput");
    const backgroundUploadButton = document.getElementById("backgroundUploadButton");
    const backgroundClearButton = document.getElementById("backgroundClearButton");
    const cancelBackground = document.getElementById("cancelBackground");
    const saveBackground = document.getElementById("saveBackground");

    let publishedState = cloneState(FALLBACK_STATE);
    let state = cloneState(FALLBACK_STATE);
    let settingsMode = false;
    let hasLocalOverride = false;
    let gridMetricFrame = 0;
    let renderedColumns = 2;
    let undoStack = [];
    let redoStack = [];
    let currentLogo = "";
    let pendingBackgroundImage = "";
    let pendingBackgroundTransparency = DEFAULT_BACKGROUND_TRANSPARENCY;
    let pendingDeleteId = "";

    function cloneState(value) {
      return JSON.parse(JSON.stringify(value));
    }

    function validateState(candidate) {
      const columns = Number(candidate?.columns || candidate?.gridSize);
      if (!candidate || !COLUMN_OPTIONS.includes(columns) || !Array.isArray(candidate.apps)) {
        return null;
      }

      const usedSlots = new Set();
      const apps = [];

      candidate.apps.forEach((app) => {
        if (!app || !Number.isInteger(app.slot) || app.slot < 0 || usedSlots.has(app.slot)) {
          return;
        }

        const name = String(app.name || "").trim();
        const url = String(app.url || "").trim();

        if (!name || !url) {
          return;
        }

        usedSlots.add(app.slot);
        apps.push({
          id: String(app.id || createId()),
          name: name.slice(0, 36),
          url: normalizeUrl(url),
          color: String(app.color || "#2563eb"),
          logo: String(app.logo || ""),
          slot: app.slot
        });
      });

      return {
        columns,
        homepageName: normalizeHomepageName(candidate.homepageName),
        accentColor: normalizeColor(candidate.accentColor, DEFAULT_ACCENT_COLOR),
        backgroundImage: String(candidate.backgroundImage || ""),
        backgroundTransparency: normalizeTransparency(candidate.backgroundTransparency),
        apps
      };
    }

    function normalizeHomepageName(value) {
      const name = String(value || DEFAULT_HOMEPAGE_NAME).trim().slice(0, 32);
      return name || DEFAULT_HOMEPAGE_NAME;
    }

    function normalizeColor(value, fallback) {
      const color = String(value || "").trim();
      return /^#[0-9a-f]{6}$/i.test(color) ? color : fallback;
    }

    function normalizeTransparency(value) {
      const transparency = Number(value);
      return [25, 50, 75].includes(transparency) ? transparency : DEFAULT_BACKGROUND_TRANSPARENCY;
    }

    function readLocalOverride() {
      try {
        const stored = JSON.parse(localStorage.getItem(STORAGE_KEY));
        return validateState(stored);
      } catch {
        return null;
      }
    }

    function saveState() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      localStorage.removeItem(LEGACY_STORAGE_KEY);
      hasLocalOverride = true;
      updateHistoryButtons();
    }

    function commitState(mutator) {
      undoStack.push(cloneState(state));
      redoStack = [];
      mutator();
      saveState();
      render();
    }

    function undoChange() {
      if (!undoStack.length) {
        return;
      }

      redoStack.push(cloneState(state));
      state = undoStack.pop();
      saveState();
      render();
    }

    function redoChange() {
      if (!redoStack.length) {
        return;
      }

      undoStack.push(cloneState(state));
      state = redoStack.pop();
      saveState();
      render();
    }

    function exportSetup() {
      const payload = {
        commandCenter: "Kousen.CommandCenter",
        version: "0.1.8",
        exportedAt: new Date().toISOString(),
        ...cloneState(state)
      };
      const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = "kousen-commandcenter-setup.json";
      link.click();
      setTimeout(() => URL.revokeObjectURL(url), 0);
    }

    function importSetup(file) {
      if (!file) {
        return;
      }

      const reader = new FileReader();
      reader.addEventListener("load", () => {
        try {
          const parsed = JSON.parse(String(reader.result || ""));
          const importedState = validateState(parsed.state || parsed);

          if (!importedState) {
            window.alert("That JSON file is not a valid CommandCenter setup.");
            return;
          }

          commitState(() => {
            state = importedState;
          });
        } catch {
          window.alert("That JSON file could not be imported.");
        } finally {
          importFileInput.value = "";
        }
      });
      reader.readAsText(file);
    }

    function clearLocalOverride() {
      localStorage.removeItem(STORAGE_KEY);
      localStorage.removeItem(LEGACY_STORAGE_KEY);
      hasLocalOverride = false;
      undoStack = [];
      redoStack = [];
      state = cloneState(publishedState);
      render();
    }

    async function initializeState() {
      try {
        const response = await fetch(`${CONFIG_URL}?t=${Date.now()}`, { cache: "no-cache" });
        if (response.ok) {
          const config = validateState(await response.json());
          if (config) {
            publishedState = config;
          }
        }
      } catch {
        publishedState = cloneState(FALLBACK_STATE);
      }

      const localOverride = readLocalOverride();
      hasLocalOverride = Boolean(localOverride);
      state = localOverride || cloneState(publishedState);
      render();
    }

    function render() {
      applyTheme();
      const columns = state.columns;
      const visibleApps = state.apps
        .slice()
        .sort((a, b) => a.slot - b.slot);
      const maxSlot = visibleApps.reduce((highest, app) => Math.max(highest, app.slot), -1);
      const occupiedSlots = Math.max(maxSlot + 1, visibleApps.length);
      const displayColumns = settingsMode ? columns : Math.min(columns, Math.max(1, occupiedSlots));
      const rowCount = Math.max(1, Math.ceil(occupiedSlots / displayColumns));
      const renderRows = settingsMode ? Math.max(rowCount, Math.ceil((occupiedSlots + 1) / displayColumns)) : rowCount;
      const totalSlots = settingsMode ? renderRows * displayColumns : occupiedSlots;
      renderedColumns = displayColumns;

      appGrid.style.setProperty("--columns", displayColumns);
      appGrid.style.setProperty("--rows", renderRows);
      appGrid.innerHTML = "";

      document.querySelectorAll(".grid-size").forEach((button) => {
        const size = Number(button.dataset.columns);
        button.classList.toggle("active", size === columns);
        button.setAttribute("aria-pressed", String(size === columns));
      });

      resetPublished.disabled = !hasLocalOverride;
      resetPublished.title = hasLocalOverride ? "Discard this device's local changes" : "Already using the published app list";
      updateHistoryButtons();

      if (!settingsMode && visibleApps.length === 0) {
        const empty = document.createElement("div");
        empty.className = "empty-state";
        empty.textContent = "Open settings to add CommandCenter apps.";
        appGrid.appendChild(empty);
        return;
      }

      for (let slot = 0; slot < totalSlots; slot += 1) {
        const slotNode = document.createElement("div");
        slotNode.className = "slot";
        slotNode.dataset.slot = String(slot);
        const app = state.apps.find((item) => item.slot === slot);

        if (app) {
          slotNode.appendChild(createAppCard(app));
        } else if (settingsMode) {
          slotNode.appendChild(createAddButton(slot));
        }

        appGrid.appendChild(slotNode);
      }

      queueGridMetrics();
      restoreUsefulFocus();
    }

    function applyTheme() {
      const accentColor = normalizeColor(state.accentColor, DEFAULT_ACCENT_COLOR);
      const homepageName = normalizeHomepageName(state.homepageName);
      const backgroundTransparency = normalizeTransparency(state.backgroundTransparency);
      brandName.textContent = homepageName;
      document.title = `${homepageName}.CommandCenter`;
      document.documentElement.style.setProperty("--brand-accent", accentColor);
      document.documentElement.style.setProperty("--background-image", state.backgroundImage ? `url(${JSON.stringify(state.backgroundImage)})` : "none");
      document.documentElement.style.setProperty("--background-overlay-opacity", String(backgroundTransparency / 100));
    }

    function updateHistoryButtons() {
      undoButton.disabled = !undoStack.length;
      redoButton.disabled = !redoStack.length;
    }

    function getOrderedApps() {
      return state.apps
        .slice()
        .sort((a, b) => a.slot - b.slot);
    }

    function moveApp(appId, direction) {
      const orderedApps = getOrderedApps();
      const currentIndex = orderedApps.findIndex((app) => app.id === appId);
      const targetIndex = currentIndex + direction;

      if (currentIndex < 0 || targetIndex < 0 || targetIndex >= orderedApps.length) {
        return;
      }

      commitState(() => {
        const reorderedApps = getOrderedApps();
        const [movedApp] = reorderedApps.splice(currentIndex, 1);
        reorderedApps.splice(targetIndex, 0, movedApp);
        state.apps = reorderedApps.map((app, slot) => ({
          ...app,
          slot
        }));
      });
    }

    function createAppCard(app) {
      const link = document.createElement("a");
      link.className = "app-card";
      link.href = normalizeUrl(app.url);
      link.dataset.slot = String(app.slot);
      link.tabIndex = settingsMode ? -1 : 0;
      link.style.setProperty("--card-color", app.color || "#2563eb");
      link.setAttribute("aria-label", `Open ${app.name}`);

      const orderedApps = getOrderedApps();
      const orderIndex = orderedApps.findIndex((item) => item.id === app.id);
      const moveActions = document.createElement("div");
      moveActions.className = "move-actions";

      const moveLeftButton = document.createElement("button");
      moveLeftButton.className = "icon-button move-button";
      moveLeftButton.type = "button";
      moveLeftButton.dataset.slot = String(app.slot);
      moveLeftButton.dataset.action = "move-left";
      moveLeftButton.innerHTML = ICONS.moveLeft;
      moveLeftButton.disabled = orderIndex <= 0;
      moveLeftButton.title = moveLeftButton.disabled ? "Already first" : "Move left";
      moveLeftButton.setAttribute("aria-label", `Move ${app.name} left`);
      moveLeftButton.addEventListener("click", (event) => {
        event.preventDefault();
        event.stopPropagation();
        moveApp(app.id, -1);
      });

      const moveRightButton = document.createElement("button");
      moveRightButton.className = "icon-button move-button";
      moveRightButton.type = "button";
      moveRightButton.dataset.slot = String(app.slot);
      moveRightButton.dataset.action = "move-right";
      moveRightButton.innerHTML = ICONS.moveRight;
      moveRightButton.disabled = orderIndex < 0 || orderIndex >= orderedApps.length - 1;
      moveRightButton.title = moveRightButton.disabled ? "Already last" : "Move right";
      moveRightButton.setAttribute("aria-label", `Move ${app.name} right`);
      moveRightButton.addEventListener("click", (event) => {
        event.preventDefault();
        event.stopPropagation();
        moveApp(app.id, 1);
      });

      moveActions.append(moveLeftButton, moveRightButton);

      const actions = document.createElement("div");
      actions.className = "edit-actions";

      const editButton = document.createElement("button");
      editButton.className = "icon-button";
      editButton.type = "button";
      editButton.dataset.slot = String(app.slot);
      editButton.dataset.action = "edit";
      editButton.innerHTML = ICONS.edit;
      editButton.title = "Edit";
      editButton.setAttribute("aria-label", `Edit ${app.name}`);
      editButton.addEventListener("click", (event) => {
        event.preventDefault();
        event.stopPropagation();
        openDialog(app.slot, app);
      });

      const deleteButton = document.createElement("button");
      deleteButton.className = "icon-button delete-button";
      deleteButton.type = "button";
      deleteButton.dataset.slot = String(app.slot);
      deleteButton.dataset.action = "delete";
      deleteButton.innerHTML = ICONS.delete;
      deleteButton.title = "Delete";
      deleteButton.setAttribute("aria-label", `Delete ${app.name}`);
      deleteButton.addEventListener("click", (event) => {
        event.preventDefault();
        event.stopPropagation();
        openDeleteDialog(app);
      });

      actions.append(editButton, deleteButton);

      const content = document.createElement("span");
      content.className = "app-content";

      const icon = document.createElement("span");
      icon.className = "app-icon";
      if (app.logo) {
        const logo = document.createElement("img");
        logo.src = app.logo;
        logo.alt = "";
        icon.appendChild(logo);
      } else {
        icon.textContent = getInitials(app.name);
      }

      const name = document.createElement("span");
      name.className = "app-name";
      name.textContent = app.name;

      content.append(icon, name);
      link.append(moveActions, actions, content);

      link.addEventListener("click", (event) => {
        if (settingsMode) {
          event.preventDefault();
        }
      });

      return link;
    }

    function createAddButton(slot) {
      const button = document.createElement("button");
      button.className = "add-card";
      button.type = "button";
      button.dataset.slot = String(slot);
      button.setAttribute("aria-label", `Add app to slot ${slot + 1}`);
      button.innerHTML = `<span class="plus-mark" aria-hidden="true">${ICONS.add}</span>`;
      button.addEventListener("click", () => openDialog(slot));
      return button;
    }

    function openDialog(slot, app = null) {
      dialogTitle.textContent = app ? "Edit App" : "Add App";
      slotInput.value = String(slot);
      editingId.value = app ? app.id : "";
      nameInput.value = app ? app.name : "";
      urlInput.value = app ? app.url : "";
      setColorSelectValue(colorInput, app ? app.color : "#2563eb");
      currentLogo = app ? app.logo || "" : "";
      renderImagePreview(logoPreview, currentLogo, "No logo selected");
      modalBackdrop.classList.add("open");
      nameInput.focus();
    }

    function closeDialogBox() {
      modalBackdrop.classList.remove("open");
      appForm.reset();
      editingId.value = "";
      slotInput.value = "";
      currentLogo = "";
      renderImagePreview(logoPreview, "", "No logo selected");
    }

    function openDeleteDialog(app) {
      pendingDeleteId = app.id;
      deleteMessage.textContent = `Delete ${app.name} from CommandCenter?`;
      deleteBackdrop.classList.add("open");
      cancelDelete.focus();
    }

    function closeDeleteDialog() {
      pendingDeleteId = "";
      deleteBackdrop.classList.remove("open");
    }

    function openBackgroundDialog() {
      homepageNameInput.value = normalizeHomepageName(state.homepageName);
      setColorSelectValue(homepageAccentInput, normalizeColor(state.accentColor, DEFAULT_ACCENT_COLOR));
      pendingBackgroundImage = state.backgroundImage || "";
      pendingBackgroundTransparency = normalizeTransparency(state.backgroundTransparency);
      renderImagePreview(backgroundPreview, pendingBackgroundImage, "No image");
      updateTransparencyButtons();
      backgroundBackdrop.classList.add("open");
      homepageNameInput.focus();
    }

    function closeBackgroundDialog() {
      pendingBackgroundImage = "";
      pendingBackgroundTransparency = DEFAULT_BACKGROUND_TRANSPARENCY;
      backgroundFileInput.value = "";
      backgroundBackdrop.classList.remove("open");
      closeColorSelects();
    }

    function updateTransparencyButtons() {
      document.querySelectorAll(".transparency-button").forEach((button) => {
        button.classList.toggle("active", Number(button.dataset.transparency) === pendingBackgroundTransparency);
      });
    }

    function renderImagePreview(preview, image, emptyText) {
      preview.innerHTML = "";
      if (!image) {
        preview.textContent = emptyText;
        return;
      }

      const img = document.createElement("img");
      img.src = image;
      img.alt = "";
      preview.appendChild(img);
    }

    function readImageFile(file, onLoad) {
      if (!file) {
        return;
      }

      const reader = new FileReader();
      reader.addEventListener("load", () => onLoad(String(reader.result || "")));
      reader.readAsDataURL(file);
    }

    function setColorSelectValue(input, value) {
      const color = normalizeColor(value, input.value || DEFAULT_ACCENT_COLOR);
      const colorSelect = input.closest(".color-select");
      const selectedOption = Array.from(colorSelect.querySelectorAll(".color-option")).find((option) => option.dataset.value === color) || colorSelect.querySelector(".color-option");
      const selectedColor = selectedOption?.dataset.value || color;
      const selectedLabel = selectedOption?.dataset.label || selectedColor;
      const valueNode = colorSelect.querySelector(".color-select-value");

      input.value = selectedColor;
      valueNode.innerHTML = `<span class="color-swatch" style="--swatch-color: ${selectedColor};"></span>${selectedLabel}`;
      colorSelect.querySelectorAll(".color-option").forEach((option) => {
        option.setAttribute("aria-selected", String(option.dataset.value === selectedColor));
      });
    }

    function closeColorSelects(except = null) {
      document.querySelectorAll(".color-select.open").forEach((colorSelect) => {
        if (colorSelect !== except) {
          colorSelect.classList.remove("open");
          colorSelect.querySelector(".color-select-button").setAttribute("aria-expanded", "false");
        }
      });
    }

    function initializeColorSelects() {
      document.querySelectorAll(".color-select").forEach((colorSelect) => {
        const input = colorSelect.querySelector(".color-select-input");
        const toggle = colorSelect.querySelector(".color-select-button");
        setColorSelectValue(input, input.value);

        toggle.addEventListener("click", () => {
          const shouldOpen = !colorSelect.classList.contains("open");
          closeColorSelects(colorSelect);
          colorSelect.classList.toggle("open", shouldOpen);
          toggle.setAttribute("aria-expanded", String(shouldOpen));
        });

        colorSelect.querySelectorAll(".color-option").forEach((option) => {
          option.addEventListener("click", () => {
            setColorSelectValue(input, option.dataset.value);
            closeColorSelects();
          });
        });
      });
    }

    function normalizeUrl(rawUrl) {
      const trimmed = String(rawUrl || "").trim();
      if (/^https?:\/\//i.test(trimmed)) {
        return trimmed;
      }
      return `http://${trimmed}`;
    }

    function getInitials(name) {
      return String(name || "?")
        .trim()
        .split(/\s+/)
        .slice(0, 2)
        .map((word) => word[0])
        .join("") || "?";
    }

    function createId() {
      if (crypto.randomUUID) {
        return crypto.randomUUID();
      }
      return `app-${Date.now()}-${Math.round(Math.random() * 100000)}`;
    }

    function setIcon(button, icon, label = "") {
      button.innerHTML = `${icon}${label ? `<span>${label}</span>` : ""}`;
    }

    function installIcons() {
      setIcon(settingsToggle, ICONS.settings);
      setIcon(exportButton, ICONS.export);
      setIcon(importButton, ICONS.import);
      setIcon(undoButton, ICONS.undo);
      setIcon(redoButton, ICONS.redo);
      setIcon(backgroundButton, ICONS.wallpaper, "Edit Homepage");
      setIcon(logoUploadButton, ICONS.imageUp, "Upload Image");
      setIcon(logoClearButton, ICONS.trash, "Clear Image");
      setIcon(backgroundUploadButton, ICONS.imageUp, "Upload Image");
      setIcon(backgroundClearButton, ICONS.trash, "Clear Image");
      document.querySelectorAll(".grid-size").forEach((button) => {
        setIcon(button, ICONS[`columns${button.dataset.columns}`]);
      });
    }

    function getColumnButtons() {
      return Array.from(document.querySelectorAll(".grid-size"));
    }

    function getTopControlTargets() {
      if (!settingsMode) {
        return [settingsToggle];
      }

      return [
        backgroundButton,
        ...getColumnButtons(),
        resetPublished,
        exportButton,
        importButton,
        undoButton,
        redoButton,
        settingsToggle
      ];
    }

    settingsToggle.addEventListener("click", () => {
      settingsMode = !settingsMode;
      shell.classList.toggle("settings-on", settingsMode);
      settingsToggle.setAttribute("aria-pressed", String(settingsMode));
      render();
    });

    document.querySelectorAll(".grid-size").forEach((button) => {
      button.addEventListener("click", () => {
        const columns = Number(button.dataset.columns);
        if (state.columns === columns) {
          return;
        }
        commitState(() => {
          state.columns = columns;
        });
      });
    });

    exportButton.addEventListener("click", exportSetup);
    importButton.addEventListener("click", () => importFileInput.click());
    importFileInput.addEventListener("change", () => {
      importSetup(importFileInput.files[0]);
    });

    appForm.addEventListener("submit", (event) => {
      event.preventDefault();
      const id = editingId.value || createId();
      const slot = Number(slotInput.value);
      const app = {
        id,
        name: nameInput.value.trim(),
        url: normalizeUrl(urlInput.value),
        color: colorInput.value,
        logo: currentLogo,
        slot
      };

      commitState(() => {
        state.apps = state.apps.filter((item) => item.id !== id && item.slot !== slot);
        state.apps.push(app);
      });
      closeDialogBox();
    });

    cancelDialog.addEventListener("click", closeDialogBox);
    modalBackdrop.addEventListener("click", (event) => {
      if (event.target === modalBackdrop) {
        closeDialogBox();
      }
    });

    logoUploadButton.addEventListener("click", () => logoFileInput.click());
    logoClearButton.addEventListener("click", () => {
      currentLogo = "";
      logoFileInput.value = "";
      renderImagePreview(logoPreview, currentLogo, "No logo selected");
    });
    logoFileInput.addEventListener("change", () => {
      readImageFile(logoFileInput.files[0], (image) => {
        currentLogo = image;
        renderImagePreview(logoPreview, currentLogo, "No logo selected");
      });
    });

    cancelDelete.addEventListener("click", closeDeleteDialog);
    deleteBackdrop.addEventListener("click", (event) => {
      if (event.target === deleteBackdrop) {
        closeDeleteDialog();
      }
    });
    confirmDelete.addEventListener("click", () => {
      const id = pendingDeleteId;
      closeDeleteDialog();
      commitState(() => {
        state.apps = state.apps.filter((item) => item.id !== id);
      });
    });

    backgroundButton.addEventListener("click", openBackgroundDialog);
    backgroundUploadButton.addEventListener("click", () => backgroundFileInput.click());
    backgroundClearButton.addEventListener("click", () => {
      pendingBackgroundImage = "";
      backgroundFileInput.value = "";
      renderImagePreview(backgroundPreview, pendingBackgroundImage, "No image");
    });
    backgroundFileInput.addEventListener("change", () => {
      readImageFile(backgroundFileInput.files[0], (image) => {
        pendingBackgroundImage = image;
        renderImagePreview(backgroundPreview, pendingBackgroundImage, "No image");
      });
    });
    document.querySelectorAll(".transparency-button").forEach((button) => {
      button.addEventListener("click", () => {
        pendingBackgroundTransparency = normalizeTransparency(button.dataset.transparency);
        updateTransparencyButtons();
      });
    });
    cancelBackground.addEventListener("click", closeBackgroundDialog);
    backgroundBackdrop.addEventListener("click", (event) => {
      if (event.target === backgroundBackdrop) {
        closeBackgroundDialog();
      }
    });
    saveBackground.addEventListener("click", () => {
      const image = pendingBackgroundImage;
      const homepageName = normalizeHomepageName(homepageNameInput.value);
      const accentColor = normalizeColor(homepageAccentInput.value, DEFAULT_ACCENT_COLOR);
      const backgroundTransparency = pendingBackgroundTransparency;
      closeBackgroundDialog();
      commitState(() => {
        state.homepageName = homepageName;
        state.accentColor = accentColor;
        state.backgroundImage = image;
        state.backgroundTransparency = backgroundTransparency;
      });
    });

    undoButton.addEventListener("click", undoChange);
    redoButton.addEventListener("click", redoChange);

    document.addEventListener("click", (event) => {
      if (!event.target.closest(".color-select")) {
        closeColorSelects();
      }
    });

    document.addEventListener("keydown", (event) => {
      handleRemoteNavigation(event);

      if (event.key === "Escape" && isAnyModalOpen()) {
        closeOpenModal();
      }
    });

    resetPublished.addEventListener("click", clearLocalOverride);
    window.addEventListener("resize", queueGridMetrics);
    window.addEventListener("load", queueGridMetrics);

    function getGridGap() {
      return Number.parseFloat(getComputedStyle(appGrid).gap) || 0;
    }

    function queueGridMetrics() {
      if (gridMetricFrame) {
        cancelAnimationFrame(gridMetricFrame);
      }

      gridMetricFrame = requestAnimationFrame(() => {
        updateGridMetrics();
        gridMetricFrame = requestAnimationFrame(() => {
          updateGridMetrics();
          gridMetricFrame = 0;
        });
      });
    }

    function updateGridMetrics() {
      const columns = renderedColumns || state.columns || 2;
      const rows = Number(appGrid.style.getPropertyValue("--rows")) || 1;
      const gap = getGridGap();
      const topbarHeight = document.querySelector(".topbar").getBoundingClientRect().height;
      const controlsHeight = settingsMode ? document.querySelector(".controls").getBoundingClientRect().height + gap : 0;
      const mainStyles = getComputedStyle(main);
      const horizontalPadding = Number.parseFloat(mainStyles.paddingLeft) + Number.parseFloat(mainStyles.paddingRight);
      const verticalPadding = Number.parseFloat(mainStyles.paddingTop) + Number.parseFloat(mainStyles.paddingBottom);
      const wrapWidth = Math.max(0, window.innerWidth - horizontalPadding);
      const wrapHeight = Math.max(240, window.innerHeight - topbarHeight - controlsHeight - verticalPadding);
      const availableWidth = Math.max(0, wrapWidth - gap * (columns - 1));
      const availableHeight = Math.max(0, wrapHeight - gap * (rows - 1));
      const maxCellSize = Math.floor(Math.min(window.innerWidth, window.innerHeight) / 3);
      const cellSize = Math.floor(Math.min(availableWidth / columns, availableHeight / rows, maxCellSize));
      const normalizedSize = Number.isFinite(cellSize) ? Math.max(64, cellSize) : 180;

      appGrid.style.setProperty("--cell-size", `${normalizedSize}px`);
      appGrid.style.gridTemplateColumns = `repeat(${columns}, ${normalizedSize}px)`;
      appGrid.style.gridAutoRows = `${normalizedSize}px`;
    }

    function isAnyModalOpen() {
      return Boolean(document.querySelector(".modal-backdrop.open"));
    }

    function closeOpenModal() {
      if (modalBackdrop.classList.contains("open")) closeDialogBox();
      if (deleteBackdrop.classList.contains("open")) closeDeleteDialog();
      if (backgroundBackdrop.classList.contains("open")) closeBackgroundDialog();
    }

    function getGridTargets() {
      const selector = settingsMode ? ".move-actions .icon-button, .edit-actions .icon-button, .add-card" : ".app-card";
      return Array.from(appGrid.querySelectorAll(selector));
    }

    function focusTarget(target) {
      if (!target) {
        return;
      }

      document.querySelectorAll(".remote-focus").forEach((item) => item.classList.remove("remote-focus"));
      target.focus({ preventScroll: true });
      target.classList.add("remote-focus");
    }

    function clearFocus() {
      document.querySelectorAll(".remote-focus").forEach((item) => item.classList.remove("remote-focus"));
      if (document.activeElement && document.activeElement !== document.body) {
        document.activeElement.blur();
      }
    }

    function getDefaultRemoteTarget() {
      return settingsToggle;
    }

    function restoreUsefulFocus() {
      if (isAnyModalOpen()) {
        return;
      }

      const active = document.activeElement;
      if (active && active !== document.body && active !== document.documentElement && document.contains(active)) {
        return;
      }

      focusTarget(getDefaultRemoteTarget());
    }

    function getRemoteTargets() {
      return [...getTopControlTargets(), ...getGridTargets()]
        .filter((target) => target && !target.disabled && target.offsetParent !== null);
    }

    function getRemoteTargetFromPointer(event) {
      return getRemoteTargets().find((target) => target === event.target || target.contains(event.target));
    }

    document.addEventListener("pointerover", (event) => {
      if (isAnyModalOpen()) {
        return;
      }

      const target = getRemoteTargetFromPointer(event);
      if (target) {
        focusTarget(target);
      }
    });

    document.addEventListener("pointerdown", (event) => {
      if (isAnyModalOpen()) {
        return;
      }

      if (!getRemoteTargetFromPointer(event)) {
        clearFocus();
      }
    });

    function getTargetCenter(target) {
      const rect = target.getBoundingClientRect();
      return {
        x: rect.left + rect.width / 2,
        y: rect.top + rect.height / 2
      };
    }

    function findDirectionalTarget(currentTarget, direction) {
      const gridTarget = findGridDirectionalTarget(currentTarget, direction);
      if (gridTarget) {
        return gridTarget;
      }

      const current = getTargetCenter(currentTarget);
      const candidates = getRemoteTargets().filter((target) => target !== currentTarget);
      let bestTarget = null;
      let bestScore = Infinity;

      candidates.forEach((target) => {
        const candidate = getTargetCenter(target);
        const dx = candidate.x - current.x;
        const dy = candidate.y - current.y;
        const primary = direction === "left" || direction === "right" ? dx : dy;
        const cross = direction === "left" || direction === "right" ? Math.abs(dy) : Math.abs(dx);

        if (direction === "left" && primary >= -2) return;
        if (direction === "right" && primary <= 2) return;
        if (direction === "up" && primary >= -2) return;
        if (direction === "down" && primary <= 2) return;

        const score = Math.abs(primary) * 1.5 + cross;
        if (score < bestScore) {
          bestScore = score;
          bestTarget = target;
        }
      });

      return bestTarget;
    }

    function findGridDirectionalTarget(currentTarget, direction) {
      if (settingsMode || !currentTarget.classList.contains("app-card")) {
        return null;
      }

      const targets = getGridTargets();
      const columns = renderedColumns || state.columns || 2;
      const currentSlot = Number(currentTarget.dataset.slot);

      if (!Number.isInteger(currentSlot) || columns < 1) {
        return null;
      }

      const targetBySlot = new Map(
        targets.map((target) => [Number(target.dataset.slot), target])
      );

      if (direction === "left" || direction === "right") {
        const adjacentSlot = currentSlot + (direction === "left" ? -1 : 1);
        const sameRow = Math.floor(adjacentSlot / columns) === Math.floor(currentSlot / columns);
        return sameRow ? targetBySlot.get(adjacentSlot) || null : null;
      }

      const currentColumn = currentSlot % columns;
      const currentRow = Math.floor(currentSlot / columns);
      let bestTarget = null;
      let bestScore = Infinity;

      targetBySlot.forEach((target, slot) => {
        const row = Math.floor(slot / columns);
        const column = slot % columns;

        if (direction === "down" && row <= currentRow) return;
        if (direction === "up" && row >= currentRow) return;

        const score = Math.abs(row - currentRow) * 100 + Math.abs(column - currentColumn);
        if (score < bestScore) {
          bestScore = score;
          bestTarget = target;
        }
      });

      return bestTarget;
    }

    function handleRemoteNavigation(event) {
      if (isAnyModalOpen()) {
        return;
      }

      const remoteTargets = getRemoteTargets();
      const visibleFocus = document.querySelector(".remote-focus");
      const active = remoteTargets.includes(document.activeElement) ? document.activeElement : visibleFocus;
      const isRemoteTarget = remoteTargets.includes(active);
      const clearKeys = ["Escape", "Backspace", "BrowserBack", "Back", "GoBack", "Home", "BrowserHome"];
      const remoteKeys = ["ArrowRight", "ArrowLeft", "ArrowUp", "ArrowDown", "Enter", " ", ...clearKeys];

      if (!remoteKeys.includes(event.key)) {
        return;
      }

      if (clearKeys.includes(event.key)) {
        event.preventDefault();
        clearFocus();
        return;
      }

      if ((event.key === "Enter" || event.key === " ") && isRemoteTarget) {
        event.preventDefault();
        active.click();
        return;
      }

      if (!isRemoteTarget) {
        if (event.key.startsWith("Arrow")) {
          event.preventDefault();
          focusTarget(getDefaultRemoteTarget());
        }
        return;
      }

      const directionByKey = {
        ArrowRight: "right",
        ArrowLeft: "left",
        ArrowUp: "up",
        ArrowDown: "down"
      };
      const direction = directionByKey[event.key];

      if (!direction) {
        return;
      }

      const nextTarget = findDirectionalTarget(active, direction);
      if (nextTarget) {
        event.preventDefault();
        focusTarget(nextTarget);
      }
    }

    initializeColorSelects();
    installIcons();
    render();
    initializeState();
  </script>
</body>
</html>
